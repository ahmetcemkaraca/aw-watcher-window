name: Collector source checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          path: aw-watcher-window
          persist-credentials: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: ahmetcemkaraca/aw-client
          ref: 4d9df4f81c49676a93a24d436842f3c97c57ebbd
          path: aw-client
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.9'
      - name: Install public source dependencies
        # shortcut: runtime packages resolve from PyPI; freeze them before release builds.
        run: python -m pip install ./aw-client ./aw-watcher-window pytest==8.4.2 mypy==1.18.2
      - name: Check Python collector
        working-directory: aw-watcher-window
        run: |
          python -m pytest -q
          python -m mypy aw_watcher_window --ignore-missing-imports
          aw-watcher-window --help
      - name: Compile native macOS collector
        if: runner.os == 'macOS'
        working-directory: aw-watcher-window
        run: make build-swift MACOSX_DEPLOYMENT_TARGET=12.0
